<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tiny Parliament</title>
    <meta name="description" content="A party game where you vote on the rules of your own game. Join with a room code from any phone. 3 to 8 players, no login." />
    <meta name="theme-color" content="#173f31" />
    <meta property="og:title" content="Tiny Parliament" />
    <meta property="og:description" content="Vote on laws that rewrite the rules of the game you're playing. Join from any phone with a room code." />
    <meta property="og:image" content="assets/cover.png" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer onerror="this.remove();var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <p class="boot">Opening the chamber doors…</p>
    </main>
    <div id="reactions" aria-hidden="true"></div>
    <div id="toast" role="status"></div>
    <dialog id="sheet"></dialog>
    <noscript>Tiny Parliament needs JavaScript turned on.</noscript>
  </body>
</html>
